version: "3.8"
services:
  postgres:
    image: postgres:18
    env_file:
      - ./.env
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: pg_isready -U postgres
      interval: 10s
      timeout: 10s
      retries: 5
  
  web:
    build:
      context: .
      dockerfile: ./terraform-aws-ecs-fargate/Dockerfile
    ports:
      - 8000:8000
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres_data: